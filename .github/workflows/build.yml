name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Jave 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Zainstaluj Gradle 8.11
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11/bin" >> $GITHUB_PATH

      - name: Zbuduj jar
        run: gradle build

      - name: Pobierz jar
        uses: actions/upload-artifact@v4
        with:
          name: aesthetics-jar
          path: build/libs/*.jar
