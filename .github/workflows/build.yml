name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Jave 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ustaw Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Zbuduj jar
        run: ${{ steps.gradle.outputs.gradle-executable }} build

      - name: Pobierz jar
        uses: actions/upload-artifact@v4
        with:
          name: aesthetics-jar
          path: build/libs/*.jar
